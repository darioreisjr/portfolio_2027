name: Segurança

# Análise de código (CodeQL) e revisão das dependências de cada pull request.
# As regras das branches recusam o merge quando o CodeQL acha alerta de
# gravidade alta ou crítica (`.github/rulesets/`); o resto avisa, e o autor
# decide. Como tratar cada alerta: skill `seguranca`.

on:
  pull_request:
  push:
    branches: [development, production]
  schedule:
    # Toda segunda, 06:00 UTC: falhas novas em código que não mudou.
    - cron: '0 6 * * 1'

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O token do GitHub não fica em .git/config para o código que roda depois.
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          # Conjunto ampliado de regras de segurança (decisão do autor, 2026-10-15).
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  # Falha se o PR trouxer pacote com vulnerabilidade conhecida, moderada ou pior.
  dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O token do GitHub não fica em .git/config para o código que roda depois.
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
