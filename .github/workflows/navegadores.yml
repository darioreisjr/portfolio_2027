name: Outros navegadores

# O portão do merge roda o e2e só no Chromium. Aqui ele roda em Firefox e WebKit,
# toda noite, sobre a branch padrão. Não bloqueia nada: uma falha vira aviso por
# e-mail e o relatório fica anexado à execução (pendência B12).

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: navegadores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm build
      - run: pnpm assemble
      - name: E2E em Firefox e WebKit
        run: pnpm test:e2e --project=firefox --project=webkit
        env:
          E2E_BROWSERS: all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: relatorio-navegadores
          path: playwright-report/
          if-no-files-found: ignore
