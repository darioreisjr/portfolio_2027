name: Outros navegadores

# O portão do merge roda o e2e só no Chromium. Aqui ele roda em Firefox e WebKit,
# toda noite, sobre a branch padrão. Não bloqueia nada: uma falha vira aviso por
# e-mail e o relatório fica anexado à execução (pendência B12).

on:
  schedule:
    - cron: '0 5 * * *'
  # Disparo manual, para investigar um teste instável: filtra pelo nome e repete.
  workflow_dispatch:
    inputs:
      filtro:
        description: Parte do nome do teste (vazio roda todos)
        required: false
        type: string
      repeticoes:
        description: Quantas vezes repetir cada teste
        required: false
        default: '1'
        type: string

concurrency:
  group: navegadores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O token do GitHub não fica em .git/config para o código que roda depois.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      # O executor não tem placa de som, e sem saída o Firefox deixa o áudio
      # suspenso: os testes de efeitos sonoros falhavam todos. Um servidor de som
      # com saída nula basta.
      - name: Saída de áudio nula
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nula
          pactl set-default-sink nula
          pactl info | grep -i "default sink"
      - run: pnpm build
      - run: pnpm assemble
      - name: E2E em Firefox e WebKit
        run: |
          set -- --project=firefox --project=webkit --repeat-each="${REPETICOES:-1}"
          if [ -n "$FILTRO" ]; then set -- "$@" --grep "$FILTRO"; fi
          pnpm test:e2e "$@"
        env:
          E2E_BROWSERS: all
          FILTRO: ${{ inputs.filtro }}
          REPETICOES: ${{ inputs.repeticoes }}
      # Sempre: um teste que só passou na repetição guarda o trace da tentativa
      # que falhou, e é por ele que se acha a causa (skill `e2e-navegadores`).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: relatorio-navegadores
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
