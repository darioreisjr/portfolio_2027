packages:
  - apps/*
  - packages/*

# Permite `VAR=valor comando` nos scripts também no Windows.
shellEmulator: true

# Único lugar onde versões são fixadas. Os package.json usam "catalog:".
catalog:
  # Linguagem e orquestração
  typescript: 6.0.3
  turbo: 2.11.7
  '@types/node': 24.19.2

  # Frameworks
  next: 16.4.2
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vue: 3.5.43
  # Animação dos três microfrontends: só as funções `animate` (mini), `inView` e
  # `stagger`, que somam 4,4 kB em cada um. A motion-v, com a camada de Vue, não
  # coube no teto do MFE do recrutador (docs/plans/recrutador-conteudo.md).
  motion: 14.1.0
  vue-tsc: 3.3.13
  '@angular/build': 22.2.2
  '@angular/cli': 22.2.2
  '@angular/common': 22.2.2
  '@angular/compiler': 22.2.2
  '@angular/compiler-cli': 22.2.2
  '@angular/core': 22.2.2
  '@angular/elements': 22.2.2
  '@angular/platform-browser': 22.2.2
  rxjs: 7.8.2
  tslib: 2.8.1
  lit: 3.3.3

  # Fonte do site (só os arquivos latinos, copiados por packages/tokens)
  '@fontsource/m-plus-rounded-1c': 5.3.0

  # Build
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  '@vitejs/plugin-vue': 6.0.10
  terser: 5.51.2

  # Conteúdo
  zod: 4.6.6

  # Testes
  vitest: 5.0.3
  '@vitest/browser-playwright': 5.0.3
  playwright: 1.64.0
  '@playwright/test': 1.64.0
  '@axe-core/playwright': 4.13.0
  jsdom: 30.1.2
  '@lhci/cli': 0.15.1

  # Storybook
  storybook: 10.6.1
  '@storybook/addon-a11y': 10.6.1
  '@storybook/web-components-vite': 10.6.1

  # Lint, formatação e commits
  eslint: 10.12.0
  '@eslint/js': 10.0.1
  globals: 17.13.0
  typescript-eslint: 8.71.1
  eslint-plugin-vue: 10.11.1
  vue-eslint-parser: 10.4.1
  angular-eslint: 22.6.0
  '@next/eslint-plugin-next': 16.4.2
  eslint-plugin-react-hooks: 7.1.1
  prettier: 3.9.10
  husky: 9.1.7
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3

# Scripts de instalação autorizados pelo autor em 2026-10-06.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

# O pnpm recusa versões com menos de 24 horas (1440 minutos), declarado aqui
# para não depender do padrão da versão instalada (autor, 2026-10-15). Uma
# exceção vai em `minimumReleaseAgeExclude`, só com autorização do autor.
minimumReleaseAge: 1440
